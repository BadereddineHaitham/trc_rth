<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Sonatrach TRC RTH HSE — Plateforme de Suivi Flotte & Équipements" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sanad TRC RTH" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Sanad — Sonatrach TRC RTH</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        background-color: #17202A;
        margin: 0;
        overflow: hidden;
      }

      #loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: #17202A;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .loader {
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top: 4px solid #FF6600;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading-container">
      <div class="loader"></div>
      <div style="font-size: 14px; font-weight: 600; color: #E5E7EB;">Chargement de Sanad...</div>
    </div>

    <script id="mobile-scanner-barcode-reader" src="zxing.min.js"></script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
