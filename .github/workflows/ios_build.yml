name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS App Bundle
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA for Diawi and Sideloadly
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -y Sanad_iOS.ipa Payload
          zip -r -y Runner_App.zip Runner.app

      - name: Upload iOS IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sanad_iOS_Package
          path: |
            build/ios/iphoneos/Sanad_iOS.ipa
            build/ios/iphoneos/Runner_App.zip
